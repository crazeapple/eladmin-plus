# eladmin-plus 生产 nginx：history 回退、gzip_static（产物预生成 .gz）+ 普通 gzip 兜底、
# 静态强缓存、/api 反代 server；TLS 与 WebSocket 为预留注释段，启用时去注释接线
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态预生成 .gz 优先（构建期产物）；找不到 .gz 的资源按原样返回
    gzip_static on;

    # 动态响应与未预生成资源的普通 gzip 兜底
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资产：内容不变，强缓存一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # history 路由回退：前端路由路径回退到入口页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端：去 /api 前缀转发，与开发代理同语义
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 收口为单值覆盖（不追加）：客户端自带的伪造链不透传，后端按真实对端地址认定来源
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Upgrade 预留段（monitor 域启用 WS 时去注释接线）：
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
        # proxy_read_timeout 3600s;
    }

    # TLS 预留段（证书就位后整体切换）：
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # 并将上方 80 监听改为跳转：
    # return 301 https://$host$request_uri;
}
