spring:
  application:
    name: eladmin-plus-server
  messages:
    # zh 为缺省语言：locale 链 miss 落 root 包（中文），不跟 JVM 系统 locale 走
    fallback-to-system-locale: false
  datasource:
    # 默认指向 compose 自起实例（just up）；环境变量可整体覆盖 URL 或分别覆盖账号
    url: '${DATASOURCE_URL:jdbc:mysql://localhost:3307/eladmin_plus?useUnicode=true&characterEncoding=utf8}'
    username: '${DATASOURCE_USERNAME:root}'
    password: '${DATASOURCE_PASSWORD:root}'
  data:
    redis:
      # 默认指向 compose 自起实例（just up）；环境变量 SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT 可覆盖
      host: localhost
      port: 6380
  quartz:
    # JDBC JobStore：任务定义持久化、重启不丢、暂停恢复与 misfire 由 Quartz 权威承载；
    # QRTZ_ 表组由 Flyway 建（V5），启动建表保持关闭
    job-store-type: jdbc
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
  servlet:
    multipart:
      # 上传体积解析层兜底（权威判定在 storage.max-size，超限一律 413）
      max-file-size: 50MB
      max-request-size: 52MB

server:
  port: 8080

monitor:
  log:
    # 日志保留天数（操作 / 异常两表轮转，清理任务每日凌晨执行）；非法值（非正整数）清理抛错不误删
    retention-days: 30

auth:
  rsa:
    key-size: 2048
    # 退役私钥留存时长：覆盖重启窗口的在途登录
    retired-ttl: 600s
  session:
    access-token-ttl: 2h
    refresh-token-ttl: 72h
    # 旋转宽限窗口：多 tab 并发刷新的后端保险
    grace-window: 30s
    cookie-name: refresh_token
    cookie-path: /
    cookie-same-site: Lax
    # 生产 TLS 开启即开（Secure 标志环境变量可配）
    cookie-secure: false

storage:
  # 存储引擎：local 本地磁盘 / rustfs 对象存储（默认 rustfs，指向 compose 实例）；切换重启生效，不是回退。
  # 环境变量覆盖（relaxed binding）：STORAGE_ENGINE / STORAGE_MAX_SIZE / STORAGE_LOCAL_BASE_PATH /
  # STORAGE_RUSTFS_ENDPOINT / STORAGE_RUSTFS_BUCKET / STORAGE_RUSTFS_ACCESS_KEY / STORAGE_RUSTFS_SECRET_KEY
  engine: rustfs
  # 上传体积权威限制（超限 413）
  max-size: 50MB
  local:
    base-path: ./data/storage
  rustfs:
    # 默认指向 compose 自起实例（just up）；已有外部 RustFS 实例以环境变量覆盖
    endpoint: http://localhost:9100
    bucket: eladmin-plus
    access-key: rustfsadmin
    secret-key: rustfsadmin

tools:
  email:
    # 发件人地址；SMTP 连接参数走 spring.mail.*（MAIL_HOST 等环境变量），未配置即邮件服务未启用
    from: '${MAIL_FROM:eladmin-plus@noreply.local}'

management:
  endpoints:
    web:
      exposure:
        include: health
