spring:
  application:
    name: eladmin-plus-server
  data:
    redis:
      # 默认指向 compose 自起实例（just up）；环境变量 SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT 可覆盖
      host: localhost
      port: 6380

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
