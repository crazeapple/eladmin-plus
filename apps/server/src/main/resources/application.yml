spring:
  application:
    name: eladmin-plus-server
  messages:
    # zh 为缺省语言：locale 链 miss 落 root 包（中文），不跟 JVM 系统 locale 走
    fallback-to-system-locale: false
  datasource:
    # 默认指向 compose 自起实例（just up）；环境变量可整体覆盖 URL 或分别覆盖账号
    url: '${DATASOURCE_URL:jdbc:mysql://localhost:3307/eladmin_plus?useUnicode=true&characterEncoding=utf8}'
    username: '${DATASOURCE_USERNAME:root}'
    password: '${DATASOURCE_PASSWORD:root}'
  data:
    redis:
      # 默认指向 compose 自起实例（just up）；环境变量 SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT 可覆盖
      host: localhost
      port: 6380
  quartz:
    # JDBC JobStore：任务定义持久化、重启不丢、暂停恢复与 misfire 由 Quartz 权威承载；
    # QRTZ_ 表组由 Flyway 建（V5），启动建表保持关闭
    job-store-type: jdbc
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

server:
  port: 8080

auth:
  rsa:
    key-size: 2048
    # 退役私钥留存时长：覆盖重启窗口的在途登录
    retired-ttl: 600s
  session:
    access-token-ttl: 2h
    refresh-token-ttl: 72h
    # 旋转宽限窗口：多 tab 并发刷新的后端保险
    grace-window: 30s
    cookie-name: refresh_token
    cookie-path: /
    cookie-same-site: Lax
    # 生产 TLS 开启即开（Secure 标志环境变量可配）
    cookie-secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
