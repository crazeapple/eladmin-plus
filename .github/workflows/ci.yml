name: CI

# 双层 CI：
#   快层 fast —— 任意分支 push：形态检查（eslint / prettier / typecheck）+ 单元测试，分钟级反馈；
#   慢层 slow —— 仅 main 与 test/* push：compose 起完整生产栈 + Playwright 全量 E2E，独立环境完整回归。
# 慢层在快层绿之后才烧时长；发布链留在本地流程，CI 只验证不发布。
on:
  push:
  workflow_dispatch:

jobs:
  fast:
    name: 'fast · lint + unit'
    runs-on: ubuntu-latest
    # server 测试为连库集成形态（经 gradle 环境注入 DATASOURCE_URL，指向
    # compose 自起实例 localhost:3307 / 6380，库不存在首跑自建）——runner 无本地栈，
    # 挂同版本服务容器补齐；缺省配置与端口映射直接对上，零 env 注入
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
          --health-start-period=30s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      # 工具链读 .mise.toml（node 24 / pnpm 12.14.0 / just），与本地一致
      - uses: jdx/mise-action@v2

      # server 单测需 JDK 21；setup-gradle 自带依赖与 wrapper 缓存
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 对齐本地门禁（lefthook pre-commit）：形态 + 类型 + JS 侧单测；server 单测单独跑
      - name: Lint & typecheck
        run: |
          pnpm exec eslint .
          pnpm exec prettier --check .
          just typecheck
      - name: JS unit tests
        run: pnpm -r run test
      - name: Server unit tests
        run: cd apps/server && ./gradlew test -PexcludeInfraTags
        env:
          # runner 无 rustfs 实例：存储走 local 引擎（落本地磁盘）；
          # 基础设施依赖测试类自带 @Tag("infra")，-PexcludeInfraTags 按标签排除
          # （真实链路由慢层 compose 栈的 tools-storage / backup-sidecar E2E 覆盖）
          STORAGE_ENGINE: local

  slow:
    name: 'slow · compose stack + E2E'
    needs: fast
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'test/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # compose 零改动：STORAGE_ENGINE=local 环境注入（双引擎参数化现成），E2E 不依赖宿主 RustFS
      - name: Bring up compose stack
        run: STORAGE_ENGINE=local docker compose -f deploy/compose.yaml up -d --build --wait

      - name: Install Playwright chromium
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm --filter @eladmin-plus/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
