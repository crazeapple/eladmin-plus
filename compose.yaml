name: eladmin-plus

services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: eladmin-plus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eladmin_plus
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: eladmin-plus-redis
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # 备份 sidecar：server 测试链（BackupChainTest）与本地排障用，端点映射宿主 9101；
  # 生产栈（deploy/compose.yaml）同服务不映射端口，仅内网可达
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    container_name: eladmin-plus-backup
    environment:
      DUMP_DB_HOST: mysql
      DUMP_DB_PORT: '3306'
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${BACKUP_PORT:-9101}:8080'

  rustfs:
    image: rustfs/rustfs:latest@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    container_name: eladmin-plus-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - '${RUSTFS_PORT:-9100}:9000'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
  rustfs_data:
